# PurePOS on Render — Blueprint from GitHub repo NickGrant89/CloudTill
# Dashboard: https://dashboard.render.com/blueprints
# After first deploy, set JWT_SECRET in the web service env.

databases:
  - name: purepos-db
    plan: free
    databaseName: purepos
    user: purepos

services:
  - type: web
    name: purepos
    runtime: docker
    dockerfilePath: ./Dockerfile.webapp
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PRODUCT_NAME
        value: PurePOS
      - key: PRODUCT_LEGAL
        value: PurePOS UK
      - key: PRODUCT_DOMAIN
        value: purepos.co.uk
      - key: DATABASE_URL
        fromDatabase:
          name: purepos-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Render also sets RENDER_EXTERNAL_URL automatically (used as PUBLIC_BASE_URL fallback)
