services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cloudtill
      POSTGRES_PASSWORD: cloudtill
      POSTGRES_DB: cloudtill
    ports:
      - "5432:5432"
    volumes:
      - cloudtill_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudtill -d cloudtill"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://cloudtill:cloudtill@db:5432/cloudtill?schema=public
      JWT_SECRET: cloudtill-docker-dev-secret
      PORT: "4000"
      HOST: "0.0.0.0"
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  cloudtill_pg:
