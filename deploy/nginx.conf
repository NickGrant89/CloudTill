# PurePOS gateway — single host for API + till + BO + ordering + marketing
# Paths match documented staging: /pos /bo /order /pricing /api

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 20m;

  upstream purepos_api {
    server api:4000;
  }

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
      proxy_pass http://purepos_api/api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /pricing {
      proxy_pass http://purepos_api/pricing;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /signup {
      proxy_pass http://purepos_api/signup;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /pos/ {
      try_files $uri $uri/ /pos/index.html;
    }
    location = /pos { return 301 /pos/; }

    location /bo/ {
      try_files $uri $uri/ /bo/index.html;
    }
    location = /bo { return 301 /bo/; }

    location /order/ {
      try_files $uri $uri/ /order/index.html;
    }
    location = /order { return 301 /order/; }

    # Marketing (index.html + assets/) at site root
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
