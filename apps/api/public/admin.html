<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>PurePOS · Platform admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #0b1c24;
        --muted: #5a6f7a;
        --panel: #ffffff;
        --line: #d5e3e0;
        --accent: #0d9488;
        --accent-deep: #0f766e;
        --danger: #b42318;
        --warn: #b54708;
        --bg: #eef6f4;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Manrope, "Avenir Next", system-ui, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(ellipse 70% 45% at 0% 0%, #c5ebe4 0%, transparent 55%),
          radial-gradient(ellipse 50% 35% at 100% 0%, #d7e8f5 0%, transparent 50%),
          var(--bg);
      }
      .wrap { width: min(1180px, calc(100% - 28px)); margin: 0 auto; padding: 28px 0 56px; }
      .brand { font-family: Fraunces, Georgia, serif; font-size: clamp(1.9rem, 3.5vw, 2.6rem); margin: 0; letter-spacing: -0.03em; }
      .sub { color: var(--muted); margin: 4px 0 0; }
      .gate, .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 20px;
        margin-top: 20px;
      }
      .gate { max-width: 520px; }
      label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
      input, select {
        width: 100%;
        min-height: 44px;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 0 12px;
        font: inherit;
        background: #fff;
      }
      .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
      .row > * { flex: 1 1 160px; }
      button {
        min-height: 44px;
        border: none;
        border-radius: 10px;
        padding: 0 14px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        background: var(--accent);
        color: #fff;
      }
      button:hover { background: var(--accent-deep); }
      button:disabled { opacity: 0.55; cursor: default; }
      button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
      button.ghost:hover { background: #f2f8f7; }
      button.danger { background: var(--danger); }
      button.danger.ghost { background: transparent; color: var(--danger); border-color: #f3c3be; }
      .msg { margin-top: 12px; color: var(--muted); font-size: 0.92rem; white-space: pre-wrap; }
      .msg.err { color: var(--danger); }
      .msg.ok { color: var(--accent-deep); }
      .hidden { display: none !important; }
      .toolbar { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 16px; }
      .toolbar .actions { display: flex; gap: 8px; }
      .stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
      @media (max-width: 860px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
      .stat {
        background: #f7fbfa;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 14px;
        text-align: left;
        color: var(--ink);
        min-height: 0;
        font-weight: 500;
      }
      .stat:hover { background: #eef7f5; }
      .stat.on { border-color: var(--accent); box-shadow: 0 0 0 2px #0d948833; }
      .stat strong { display: block; font-size: 1.5rem; font-family: Fraunces, Georgia, serif; }
      .stat span { color: var(--muted); font-size: 0.85rem; }
      h2 { font-family: Fraunces, Georgia, serif; font-size: 1.25rem; margin: 0; }
      .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
      .panel-head input { max-width: 320px; }
      .pill {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 0.78rem;
        font-weight: 700;
        background: #e6f4f1;
        color: var(--accent-deep);
        white-space: nowrap;
      }
      .pill.trialing { background: #fff4e5; color: var(--warn); }
      .pill.expired, .pill.canceled, .pill.past_due { background: #fdecea; color: var(--danger); }
      .pill.demo { background: #eef0ff; color: #3b3f9e; }
      .biz { border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-top: 12px; }
      .biz-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
      .biz-name { font-weight: 800; font-size: 1.05rem; }
      .biz-meta { color: var(--muted); font-size: 0.88rem; margin-top: 4px; line-height: 1.5; }
      .biz-meta a { color: var(--accent-deep); }
      .billing-line { margin-top: 10px; font-size: 0.95rem; }
      .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
      .controls select, .controls input { width: auto; min-height: 38px; }
      .controls input[type="number"] { width: 76px; }
      .controls button { min-height: 38px; font-size: 0.86rem; padding: 0 12px; }
      .controls .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 4px; }
      .keyout {
        margin-top: 12px;
        padding: 12px;
        background: #0b1c24;
        color: #e8fff9;
        border-radius: 10px;
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .keyout code { font-size: 1rem; word-break: break-all; flex: 1 1 220px; }
      .keyout button { min-height: 36px; background: #e8fff9; color: #0b1c24; }
      .events { list-style: none; margin: 0; padding: 0; }
      .events li { padding: 10px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 170px 1fr; gap: 12px; font-size: 0.92rem; }
      .events time { color: var(--muted); font-size: 0.85rem; }
      @media (max-width: 640px) {
        .events li { grid-template-columns: 1fr; gap: 2px; }
        .controls .sep { display: none; }
      }
      .empty { color: var(--muted); padding: 12px 0; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <p class="brand">PurePOS</p>
      <p class="sub">Platform admin · every business on PurePOS, their plans and licence keys</p>

      <section id="gate" class="gate">
        <label for="secret">Admin password</label>
        <div class="row">
          <div><input id="secret" type="password" autocomplete="current-password" placeholder="Admin password" /></div>
          <div style="flex: 0 0 auto"><button id="unlock" type="button">Unlock</button></div>
        </div>
        <p class="msg" id="gateMsg">This is the <strong>PLATFORM_ADMIN_SECRET</strong> value from Railway → web → Variables.</p>
      </section>

      <section id="app" class="hidden">
        <div class="toolbar">
          <div class="sub" id="generatedAt"></div>
          <div class="actions">
            <button type="button" class="ghost" id="refresh">Refresh</button>
            <button type="button" class="ghost" id="lock">Lock</button>
          </div>
        </div>
        <div class="stats" id="stats"></div>

        <div class="panel">
          <div class="panel-head">
            <h2>Businesses</h2>
            <input id="search" type="search" placeholder="Search name, email or branch" aria-label="Search businesses" />
          </div>
          <div id="keyBanner" class="keyout hidden"></div>
          <p class="msg" id="actionMsg"></p>
          <div id="bizList"></div>
        </div>

        <div class="panel">
          <h2 style="margin-bottom: 8px">Recent activity</h2>
          <ul class="events" id="events"></ul>
        </div>
      </section>
    </div>
    <script>
      const STORAGE_KEY = "purepos.platformAdminSecret";
      const PLAN_NAMES = { starter: "Counter", pro: "Venue", multi: "Multi-site" };
      const STATUS = {
        trialing: "Free trial",
        active: "Paid",
        past_due: "Payment overdue",
        expired: "Trial ended",
        canceled: "Cancelled",
      };
      const FILTERS = [
        ["all", "Businesses"],
        ["trialing", "On free trial"],
        ["active", "Paid"],
        ["expired", "Trial ended"],
        ["canceled", "Cancelled"],
      ];
      const gate = document.getElementById("gate");
      const app = document.getElementById("app");
      const secretInput = document.getElementById("secret");
      const gateMsg = document.getElementById("gateMsg");
      const actionMsg = document.getElementById("actionMsg");
      const keyBanner = document.getElementById("keyBanner");
      const searchInput = document.getElementById("search");
      let secret = sessionStorage.getItem(STORAGE_KEY) || "";
      let businesses = [];
      let filter = "all";

      async function api(path, opts = {}) {
        const headers = Object.assign(
          { "Content-Type": "application/json", "X-Platform-Admin-Secret": secret },
          opts.headers || {}
        );
        const res = await fetch("/api/admin" + path, Object.assign({}, opts, { headers }));
        const data = await res.json().catch(() => ({}));
        if (res.status === 401) throw new Error("Wrong admin password");
        if (!res.ok) throw new Error(data.error || res.statusText || "Request failed");
        return data;
      }

      function esc(s) {
        return String(s ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }
      function day(v) {
        return v ? new Date(v).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric", timeZone: "Europe/London" }) : "";
      }
      function when(v) {
        if (!v) return "";
        return new Date(v).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", timeZone: "Europe/London" }) + " London";
      }
      function plural(n, word) { return `${n} ${word}${n === 1 ? "" : "s"}`; }
      function setMsg(text, kind) {
        actionMsg.textContent = text || "";
        actionMsg.className = "msg" + (kind ? " " + kind : "");
      }

      function showKey(licenseKey, bizName) {
        if (!licenseKey) {
          keyBanner.classList.add("hidden");
          keyBanner.innerHTML = "";
          return;
        }
        keyBanner.classList.remove("hidden");
        keyBanner.innerHTML = `<span>New licence key for <strong>${esc(bizName)}</strong>:</span><code>${esc(licenseKey)}</code><button type="button" id="copyKey">Copy</button>`;
        document.getElementById("copyKey").onclick = async () => {
          try {
            await navigator.clipboard.writeText(licenseKey);
            document.getElementById("copyKey").textContent = "Copied";
          } catch {
            document.getElementById("copyKey").textContent = "Select and copy";
          }
        };
      }

      function groupBusinesses(stores) {
        const map = new Map();
        for (const s of stores) {
          const key = s.companyKey || s.id;
          if (!map.has(key)) map.set(key, []);
          map.get(key).push(s);
        }
        return [...map.entries()].map(([key, list]) => {
          list.sort((a, b) => (a.createdAt < b.createdAt ? -1 : 1));
          const hq = list[0];
          const owners = [...new Set(list.flatMap((s) => (s.owners || []).map((o) => o.email).filter(Boolean)))];
          return {
            key,
            hq,
            branches: list,
            isDemo: key === "demo",
            owners,
            items: list.reduce((n, s) => n + (s.counts?.items || 0), 0),
            sales: list.reduce((n, s) => n + (s.counts?.sales || 0), 0),
            staff: list.reduce((n, s) => n + (s.counts?.employees || 0), 0),
          };
        }).sort((a, b) => (a.hq.createdAt < b.hq.createdAt ? 1 : -1));
      }

      function billingSentence(b) {
        const plan = PLAN_NAMES[b.planId] || b.planName;
        if (b.status === "trialing") return `${plan} free trial${b.trialEndsAt ? ` until ${day(b.trialEndsAt)}` : ""}`;
        if (b.status === "active") {
          const lic = b.licensedPlanId && b.licensedPlanId !== b.planId ? ` (paid for up to ${PLAN_NAMES[b.licensedPlanId]})` : "";
          return `${plan}, paid${lic}`;
        }
        if (b.status === "expired") return `${plan} trial ended ${day(b.trialEndsAt)} · paid features off`;
        if (b.status === "canceled") return `${plan} cancelled · paid features off`;
        return `${plan} · ${STATUS[b.status] || b.status}`;
      }

      function renderStats() {
        const count = (st) => (st === "all" ? businesses.length : businesses.filter((b) => b.hq.billing.status === st).length);
        document.getElementById("stats").innerHTML = FILTERS.map(
          ([st, label]) =>
            `<button type="button" class="stat ${filter === st ? "on" : ""}" data-filter="${st}"><strong>${count(st)}</strong><span>${label}</span></button>`
        ).join("");
      }

      function renderBusinesses() {
        const q = searchInput.value.trim().toLowerCase();
        const list = businesses.filter((b) => {
          if (filter !== "all" && b.hq.billing.status !== filter) return false;
          if (!q) return true;
          const hay = [b.hq.name, b.hq.slug, ...b.owners, ...b.branches.map((s) => s.name)].join(" ").toLowerCase();
          return hay.includes(q);
        });
        const el = document.getElementById("bizList");
        if (!list.length) {
          el.innerHTML = `<p class="empty">No businesses match.</p>`;
          return;
        }
        el.innerHTML = list.map((b) => {
          const bl = b.hq.billing;
          const branchNames = b.branches.length > 1
            ? `<div>Branches: ${b.branches.map((s) => esc(s.name)).join(" · ")}</div>`
            : "";
          const key = bl.licenseKeyLast ? `<div>Licence key: <code>${esc(bl.licenseKeyLast)}</code></div>` : "";
          const id = esc(b.hq.id);
          const planOptions = Object.entries(PLAN_NAMES)
            .map(([v, n]) => `<option value="${v}" ${bl.planId === v ? "selected" : ""}>${n}</option>`)
            .join("");
          return `<article class="biz" data-id="${id}" data-name="${esc(b.hq.name)}">
            <div class="biz-head">
              <div>
                <div class="biz-name">${esc(b.hq.name)}</div>
                <div class="biz-meta">
                  <div>${b.owners.length ? esc(b.owners.join(", ")) : "No owner login"} · signed up ${day(b.hq.createdAt)}</div>
                  ${branchNames}
                  <div>${plural(b.branches.length, "store")} · ${plural(b.items, "item")} · ${plural(b.sales, "sale")} · ${plural(b.staff, "staff login")}</div>
                  <div><a href="/order/${esc(b.hq.slug)}" target="_blank" rel="noreferrer">Ordering page</a></div>
                  ${key}
                </div>
              </div>
              <span class="pill ${b.isDemo ? "demo" : esc(bl.status)}">${b.isDemo ? "Demo" : esc(STATUS[bl.status] || bl.status)}</span>
            </div>
            <div class="billing-line">${esc(billingSentence(bl))}</div>
            ${b.isDemo ? `<p class="biz-meta">The shared demo is locked: its plan can't be changed and it can't be deleted.</p>` : `
            <div class="controls">
              <select class="planPick" aria-label="Plan">${planOptions}</select>
              <button type="button" data-act="issue">Issue licence key</button>
              <button type="button" class="ghost" data-act="paid">Mark as paid</button>
              <span class="sep"></span>
              <label class="sub" style="margin:0;font-weight:500">Trial</label>
              <input class="trialDays" type="number" min="1" max="365" value="14" aria-label="Trial days" />
              <button type="button" class="ghost" data-act="trial">days from today</button>
              <span class="sep"></span>
              ${bl.licenseKeyLast ? `<button type="button" class="ghost" data-act="rotate">New key</button>` : ""}
              ${bl.status === "canceled" ? "" : `<button type="button" class="ghost danger" data-act="revoke">Cancel plan</button>`}
              <button type="button" class="ghost danger" data-act="delete">Delete business</button>
            </div>`}
          </article>`;
        }).join("");
      }

      const EVENT_TEXT = {
        signup: (d) => `Signed up for a ${PLAN_NAMES[d.planId] || "free"} trial${d.email ? ` (${d.email})` : ""}`,
        change_plan: (d) => `Owner switched plan ${PLAN_NAMES[d.from] || d.from} → ${PLAN_NAMES[d.to] || d.to}`,
        activate_license: (d) => `Licence activated: ${PLAN_NAMES[d.planId] || d.planId}${d.via === "public" ? " (pricing page)" : d.via === "bo" ? " (back office)" : ""}`,
        admin_issue_license: (d) => `You issued a ${PLAN_NAMES[d.planId] || ""} licence key`,
        admin_rotate_license: () => "You replaced the licence key",
        admin_revoke_license: () => "You cancelled the plan",
        admin_change_plan: (d) => `You set the plan to ${PLAN_NAMES[d.planId] || d.planId}${d.status === "active" ? ", paid" : ""}`,
        admin_extend_trial: (d) => `You set the trial to end ${day(d.trialEndsAt)}`,
      };

      function renderEvents(events) {
        const el = document.getElementById("events");
        el.innerHTML = (events || []).map((e) => {
          const fn = EVENT_TEXT[e.type];
          const text = fn ? fn(e.detail || {}) : e.type.replace(/_/g, " ");
          return `<li><time>${when(e.at)}</time><div><strong>${esc(e.storeName)}</strong> · ${esc(text)}</div></li>`;
        }).join("") || `<li class="empty">Nothing yet</li>`;
      }

      async function loadOverview() {
        const data = await api("/overview");
        document.getElementById("generatedAt").textContent = "Updated " + when(data.generatedAt);
        businesses = groupBusinesses(data.stores);
        renderStats();
        renderBusinesses();
        renderEvents(data.recentEvents);
      }

      async function unlock() {
        secret = secretInput.value.trim();
        if (!secret) {
          gateMsg.textContent = "Enter the admin password.";
          gateMsg.className = "msg err";
          return;
        }
        try {
          await loadOverview();
          sessionStorage.setItem(STORAGE_KEY, secret);
          gate.classList.add("hidden");
          app.classList.remove("hidden");
        } catch (err) {
          gateMsg.textContent = err.message || String(err);
          gateMsg.className = "msg err";
        }
      }

      document.getElementById("unlock").addEventListener("click", unlock);
      secretInput.addEventListener("keydown", (e) => { if (e.key === "Enter") unlock(); });
      document.getElementById("lock").addEventListener("click", () => {
        sessionStorage.removeItem(STORAGE_KEY);
        secret = "";
        secretInput.value = "";
        app.classList.add("hidden");
        gate.classList.remove("hidden");
        showKey(null);
      });
      document.getElementById("refresh").addEventListener("click", () => {
        loadOverview().then(() => setMsg("")).catch((err) => setMsg(err.message, "err"));
      });
      searchInput.addEventListener("input", renderBusinesses);
      document.getElementById("stats").addEventListener("click", (e) => {
        const btn = e.target.closest("[data-filter]");
        if (!btn) return;
        filter = btn.getAttribute("data-filter");
        renderStats();
        renderBusinesses();
      });

      document.getElementById("bizList").addEventListener("click", async (e) => {
        const btn = e.target.closest("button[data-act]");
        if (!btn) return;
        const card = btn.closest(".biz");
        const id = card.getAttribute("data-id");
        const name = card.getAttribute("data-name");
        const act = btn.getAttribute("data-act");
        const planId = card.querySelector(".planPick")?.value;
        const plan = PLAN_NAMES[planId];
        try {
          showKey(null);
          if (act === "issue") {
            if (!confirm(`Issue a ${plan} licence key for ${name}? Their plan becomes paid ${plan} straight away.`)) return;
            const res = await api(`/stores/${id}/license/issue`, { method: "POST", body: JSON.stringify({ planId, activate: true }) });
            showKey(res.licenseKey, name);
            setMsg(`${name} is now on paid ${plan}. Send them the key above — they can also enter it in Settings → Billing.`, "ok");
          } else if (act === "paid") {
            if (!confirm(`Mark ${name} as paid ${plan} without a licence key?`)) return;
            await api(`/stores/${id}/plan`, { method: "POST", body: JSON.stringify({ planId, status: "active" }) });
            setMsg(`${name} is now on paid ${plan}.`, "ok");
          } else if (act === "trial") {
            const days = Number(card.querySelector(".trialDays").value || 14);
            if (!confirm(`Put ${name} on a free trial ending ${days} days from today? If they've paid, this switches them back to a trial.`)) return;
            await api(`/stores/${id}/trial`, { method: "POST", body: JSON.stringify({ days, status: "trialing" }) });
            setMsg(`${name}'s trial now ends ${day(Date.now() + days * 86400000)}.`, "ok");
          } else if (act === "rotate") {
            if (!confirm(`Replace ${name}'s licence key? The old key stops working.`)) return;
            const res = await api(`/stores/${id}/license/rotate`, { method: "POST", body: "{}" });
            showKey(res.licenseKey, name);
            setMsg("Old key replaced.", "ok");
          } else if (act === "revoke") {
            if (!confirm(`Cancel ${name}'s plan? Their key stops working and paid features switch off. The till keeps working.`)) return;
            await api(`/stores/${id}/license/revoke`, { method: "POST", body: "{}" });
            setMsg(`${name}'s plan is cancelled.`, "ok");
          } else if (act === "delete") {
            const typed = prompt(`This permanently deletes ${name}, all its branches, items, sales, customers and staff logins. It can't be undone.\n\nType the business name to confirm:`);
            if (typed === null) return;
            await api(`/companies/${id}`, { method: "DELETE", body: JSON.stringify({ confirmName: typed }) });
            setMsg(`${name} was deleted.`, "ok");
          }
          await loadOverview();
        } catch (err) {
          setMsg(err.message || String(err), "err");
        }
      });

      (async function boot() {
        try {
          const status = await fetch("/api/admin/status").then((r) => r.json());
          if (!status.configured) {
            gateMsg.textContent = "Admin isn't switched on: add PLATFORM_ADMIN_SECRET in Railway → web → Variables, redeploy, then come back.";
            gateMsg.className = "msg err";
          }
        } catch (_) {}
        if (secret) {
          secretInput.value = secret;
          unlock();
        }
      })();
    </script>
  </body>
</html>
