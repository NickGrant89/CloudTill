<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PurePOS · Platform admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #0b1c24;
        --muted: #5a6f7a;
        --panel: #ffffff;
        --line: #d5e3e0;
        --accent: #0d9488;
        --accent-deep: #0f766e;
        --danger: #b42318;
        --warn: #b54708;
        --bg: #eef6f4;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Manrope, "Avenir Next", system-ui, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(ellipse 70% 45% at 0% 0%, #c5ebe4 0%, transparent 55%),
          radial-gradient(ellipse 50% 35% at 100% 0%, #d7e8f5 0%, transparent 50%),
          var(--bg);
      }
      .wrap { width: min(1180px, calc(100% - 28px)); margin: 0 auto; padding: 28px 0 56px; }
      .brand {
        font-family: Fraunces, Georgia, serif;
        font-size: clamp(1.9rem, 3.5vw, 2.6rem);
        margin: 0;
        letter-spacing: -0.03em;
      }
      .sub { color: var(--muted); margin: 6px 0 0; }
      .gate, .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 20px;
        margin-top: 20px;
      }
      label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
      input, select {
        width: 100%;
        min-height: 44px;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 0 12px;
        font: inherit;
        background: #fff;
      }
      .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
      .row > * { flex: 1 1 160px; }
      button {
        min-height: 44px;
        border: none;
        border-radius: 10px;
        padding: 0 14px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        background: var(--accent);
        color: #fff;
      }
      button:hover { background: var(--accent-deep); }
      button.ghost {
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--line);
      }
      button.danger { background: var(--danger); }
      button.warn { background: var(--warn); }
      .msg { margin-top: 12px; color: var(--muted); font-size: 0.92rem; white-space: pre-wrap; }
      .msg.err { color: var(--danger); }
      .msg.ok { color: var(--accent-deep); }
      .hidden { display: none !important; }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin-top: 16px;
      }
      @media (max-width: 720px) { .stats { grid-template-columns: 1fr; } }
      .stat {
        background: #f7fbfa;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px 16px;
      }
      .stat strong { display: block; font-size: 1.5rem; font-family: Fraunces, Georgia, serif; }
      .stat span { color: var(--muted); font-size: 0.85rem; }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.92rem;
      }
      th, td {
        text-align: left;
        padding: 10px 8px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }
      th { color: var(--muted); font-weight: 600; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.82rem; }
      .pill {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 700;
        background: #e6f4f1;
        color: var(--accent-deep);
      }
      .pill.trialing { background: #fff4e5; color: var(--warn); }
      .pill.canceled, .pill.past_due { background: #fdecea; color: var(--danger); }
      .actions { display: flex; flex-wrap: wrap; gap: 6px; }
      .actions button { min-height: 34px; font-size: 0.8rem; padding: 0 10px; }
      h2 {
        font-family: Fraunces, Georgia, serif;
        font-size: 1.25rem;
        margin: 0 0 12px;
      }
      .toolbar { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
      .keyout {
        margin-top: 10px;
        padding: 10px 12px;
        background: #0b1c24;
        color: #e8fff9;
        border-radius: 10px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        word-break: break-all;
      }
      .events td { font-size: 0.86rem; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <p class="brand">PurePOS</p>
      <p class="sub">Platform licensing admin — not store back office</p>

      <section id="gate" class="gate">
        <label for="secret">Platform admin secret</label>
        <div class="row">
          <div>
            <input id="secret" type="password" autocomplete="current-password" placeholder="PLATFORM_ADMIN_SECRET value" />
          </div>
          <div style="flex: 0 0 auto">
            <button id="unlock" type="button">Unlock</button>
          </div>
        </div>
        <p class="msg" id="gateMsg">Uses header <span class="mono">X-Platform-Admin-Secret</span>. Set <span class="mono">PLATFORM_ADMIN_SECRET</span> on the host.</p>
      </section>

      <section id="app" class="hidden">
        <div class="toolbar">
          <div>
            <strong id="hostLabel">Connected</strong>
            <span class="sub" id="generatedAt"></span>
          </div>
          <div class="actions">
            <button type="button" class="ghost" id="refresh">Refresh</button>
            <button type="button" class="ghost" id="lock">Lock</button>
          </div>
        </div>
        <div class="stats" id="stats"></div>
        <div class="panel">
          <h2>Companies / stores</h2>
          <div style="overflow-x: auto">
            <table>
              <thead>
                <tr>
                  <th>Store</th>
                  <th>Plan</th>
                  <th>Trial / status</th>
                  <th>License</th>
                  <th>Owners</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="storesBody"></tbody>
            </table>
          </div>
          <div id="keyBanner" class="keyout hidden"></div>
          <p class="msg" id="actionMsg"></p>
        </div>
        <div class="panel">
          <h2>Recent signups &amp; activation events</h2>
          <div style="overflow-x: auto">
            <table class="events">
              <thead>
                <tr>
                  <th>When</th>
                  <th>Store</th>
                  <th>Event</th>
                  <th>Detail</th>
                </tr>
              </thead>
              <tbody id="eventsBody"></tbody>
            </table>
          </div>
        </div>
      </section>
    </div>
    <script>
      const STORAGE_KEY = "purepos.platformAdminSecret";
      const gate = document.getElementById("gate");
      const app = document.getElementById("app");
      const secretInput = document.getElementById("secret");
      const gateMsg = document.getElementById("gateMsg");
      const actionMsg = document.getElementById("actionMsg");
      const keyBanner = document.getElementById("keyBanner");
      let secret = sessionStorage.getItem(STORAGE_KEY) || "";

      async function api(path, opts = {}) {
        const headers = Object.assign(
          { "Content-Type": "application/json", "X-Platform-Admin-Secret": secret },
          opts.headers || {}
        );
        const res = await fetch("/api/admin" + path, Object.assign({}, opts, { headers }));
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || res.statusText || "Request failed");
        return data;
      }

      function fmtDate(v) {
        if (!v) return "—";
        try {
          return new Date(v).toLocaleString("en-GB", { timeZone: "Europe/London" }) + " Europe/London";
        } catch {
          return String(v);
        }
      }

      function setMsg(el, text, kind) {
        el.textContent = text || "";
        el.className = "msg" + (kind ? " " + kind : "");
      }

      function showKey(licenseKey) {
        if (!licenseKey) {
          keyBanner.classList.add("hidden");
          keyBanner.textContent = "";
          return;
        }
        keyBanner.classList.remove("hidden");
        keyBanner.textContent = "Issued license key (copy now): " + licenseKey;
      }

      async function loadOverview() {
        const data = await api("/overview");
        document.getElementById("generatedAt").textContent =
          " · refreshed " + fmtDate(data.generatedAt);
        const trialing = data.stores.filter((s) => s.billing.status === "trialing").length;
        const licensed = data.stores.filter((s) => s.billing.licenseFingerprint).length;
        document.getElementById("stats").innerHTML = [
          ["Stores", data.storeCount],
          ["On trial", trialing],
          ["With license fingerprint", licensed],
        ]
          .map(
            ([label, value]) =>
              `<div class="stat"><strong>${value}</strong><span>${label}</span></div>`
          )
          .join("");

        const body = document.getElementById("storesBody");
        body.innerHTML = data.stores
          .map((s) => {
            const owners = (s.owners || [])
              .map((o) => `${o.email || o.name || o.id}`)
              .join(", ") || "—";
            const trial =
              s.billing.trialEndsAt
                ? `ends ${fmtDate(s.billing.trialEndsAt)}`
                : "—";
            const keyLast = s.billing.licenseKeyLast
              ? `<div class="mono">${s.billing.licenseKeyLast}</div>`
              : "";
            const fp = s.billing.licenseFingerprint
              ? `<div class="mono">${s.billing.licenseFingerprint}</div>`
              : "<span class='sub'>none</span>";
            return `<tr data-id="${s.id}">
              <td>
                <strong>${escapeHtml(s.name)}</strong>
                <div class="mono">${escapeHtml(s.slug)}</div>
                <div class="sub">created ${fmtDate(s.createdAt)}</div>
              </td>
              <td>
                <div>${escapeHtml(s.billing.planName || s.billing.planId)}</div>
                <select class="planPick" data-id="${s.id}">
                  <option value="starter" ${s.billing.planId === "starter" ? "selected" : ""}>Solo</option>
                  <option value="pro" ${s.billing.planId === "pro" ? "selected" : ""}>Shop</option>
                  <option value="multi" ${s.billing.planId === "multi" ? "selected" : ""}>Group</option>
                </select>
              </td>
              <td>
                <span class="pill ${escapeHtml(s.billing.status)}">${escapeHtml(s.billing.status)}</span>
                <div class="sub">${trial}</div>
                <div class="row" style="margin-top:8px">
                  <input class="extendDays" data-id="${s.id}" type="number" min="1" max="365" value="14" style="max-width:88px" />
                </div>
              </td>
              <td>${fp}${keyLast}</td>
              <td>${escapeHtml(owners)}</td>
              <td>
                <div class="actions">
                  <button type="button" data-act="plan" data-id="${s.id}">Set plan</button>
                  <button type="button" class="warn" data-act="trial" data-id="${s.id}">Extend trial</button>
                  <button type="button" data-act="issue" data-id="${s.id}">Issue key</button>
                  <button type="button" data-act="rotate" data-id="${s.id}">Rotate</button>
                  <button type="button" class="danger" data-act="revoke" data-id="${s.id}">Revoke</button>
                </div>
              </td>
            </tr>`;
          })
          .join("");

        const eventsBody = document.getElementById("eventsBody");
        eventsBody.innerHTML = (data.recentEvents || [])
          .map((e) => {
            const detail = escapeHtml(JSON.stringify(e.detail || {}));
            return `<tr>
              <td>${fmtDate(e.at)}</td>
              <td>${escapeHtml(e.storeName)} <span class="mono">${escapeHtml(e.storeSlug)}</span></td>
              <td><span class="pill">${escapeHtml(e.type)}</span></td>
              <td class="mono">${detail}</td>
            </tr>`;
          })
          .join("") || `<tr><td colspan="4">No events yet</td></tr>`;
      }

      function escapeHtml(s) {
        return String(s ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      async function unlock() {
        secret = secretInput.value.trim();
        if (!secret) {
          setMsg(gateMsg, "Enter the PLATFORM_ADMIN_SECRET value.", "err");
          return;
        }
        try {
          await api("/overview");
          sessionStorage.setItem(STORAGE_KEY, secret);
          gate.classList.add("hidden");
          app.classList.remove("hidden");
          setMsg(gateMsg, "", "");
          await loadOverview();
        } catch (err) {
          setMsg(gateMsg, err.message || String(err), "err");
        }
      }

      document.getElementById("unlock").addEventListener("click", unlock);
      secretInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") unlock();
      });
      document.getElementById("lock").addEventListener("click", () => {
        sessionStorage.removeItem(STORAGE_KEY);
        secret = "";
        secretInput.value = "";
        app.classList.add("hidden");
        gate.classList.remove("hidden");
        showKey(null);
      });
      document.getElementById("refresh").addEventListener("click", () => {
        loadOverview().catch((err) => setMsg(actionMsg, err.message, "err"));
      });

      document.getElementById("storesBody").addEventListener("click", async (e) => {
        const btn = e.target.closest("button[data-act]");
        if (!btn) return;
        const id = btn.getAttribute("data-id");
        const act = btn.getAttribute("data-act");
        try {
          setMsg(actionMsg, "Working…", "");
          showKey(null);
          if (act === "plan") {
            const planId = document.querySelector(`select.planPick[data-id="${id}"]`).value;
            await api(`/stores/${id}/plan`, {
              method: "POST",
              body: JSON.stringify({ planId, status: "active" }),
            });
            setMsg(actionMsg, `Plan set to ${planId}.`, "ok");
          } else if (act === "trial") {
            const days = Number(document.querySelector(`input.extendDays[data-id="${id}"]`).value || 14);
            await api(`/stores/${id}/trial`, {
              method: "POST",
              body: JSON.stringify({ days, status: "trialing" }),
            });
            setMsg(actionMsg, `Trial extended by ${days} days.`, "ok");
          } else if (act === "issue") {
            const planId = document.querySelector(`select.planPick[data-id="${id}"]`).value;
            const res = await api(`/stores/${id}/license/issue`, {
              method: "POST",
              body: JSON.stringify({ planId, activate: true }),
            });
            showKey(res.licenseKey);
            setMsg(actionMsg, "License issued and activated.", "ok");
          } else if (act === "rotate") {
            const res = await api(`/stores/${id}/license/rotate`, { method: "POST", body: "{}" });
            showKey(res.licenseKey);
            setMsg(actionMsg, "License rotated.", "ok");
          } else if (act === "revoke") {
            if (!confirm("Revoke license and mark store canceled?")) return;
            await api(`/stores/${id}/license/revoke`, { method: "POST", body: "{}" });
            setMsg(actionMsg, "License revoked.", "ok");
          }
          await loadOverview();
        } catch (err) {
          setMsg(actionMsg, err.message || String(err), "err");
        }
      });

      (async function boot() {
        try {
          const status = await fetch("/api/admin/status").then((r) => r.json());
          if (!status.configured) {
            setMsg(
              gateMsg,
              "PLATFORM_ADMIN_SECRET is not set on this host. Add it in Railway variables, redeploy, then unlock here.",
              "err"
            );
          }
        } catch (_) {}
        if (secret) {
          secretInput.value = secret;
          unlock();
        }
      })();
    </script>
  </body>
</html>
